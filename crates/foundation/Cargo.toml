[package]
name = "foundation"
version = "0.0.0"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "For Empire, the foundation we lay. Shared service foundations for the Skuld Systems Rust workspace."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=docsrs", "--cfg=tokio_unstable"]

[features]
default = []
config = [
    "dep:foundation-macros",
    "dep:foundation-types",
    "dep:serde-saphyr",
]
jemalloc = ["dep:tikv-jemallocator"]
otel = [
    "dep:http",
    "dep:humantime-serde",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry_sdk",
    "dep:serde",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-panic",
    "dep:tracing-subscriber",
]
full = ["config", "jemalloc", "otel"]

[dependencies]
anyhow.workspace = true
foundation-macros = { workspace = true, optional = true }
foundation-types = { workspace = true, optional = true }
http = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-panic = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
insta = { version = "1.46.3", features = ["redactions"] }
url.workspace = true

[lints]
workspace = true

[[example]]
name = "config_cli"
required-features = ["config"]
