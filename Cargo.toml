[workspace]
resolver = "3"
members = ["crates/*", "tests/integration"]

[workspace.package]
repository = "https://github.com/MikeIvanichev/foundation.git"
edition = "2024"
# LINT.IfChange(msrv)
rust-version = "1.95.0"
# LINT.ThenChange(//.github/workflows/ci.yaml:msrv)
publish = false

[workspace.dependencies]
automod = "1.0.14"
anyhow = { version = "1.0.100", default-features = false, features = ["std"] }
clap = { version = "4.5.39", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
foundation-macros = { path = "crates/foundation-macros", version = "0.0.0" }
foundation-types = { path = "crates/foundation-types", version = "0.0.0" }
http = { version = "1.3.1", default-features = false, features = ["std"] }
humantime-serde = { version = "1.1.1", default-features = false }
opentelemetry = { version = "0.31.0", default-features = false, features = [
  "metrics",
  "trace",
] }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = [
  "grpc-tonic",
  "metrics",
  "tls-webpki-roots",
  "trace",
  "zstd-tonic",
] }
opentelemetry-semantic-conventions = { version = "0.31.0", default-features = false, features = [
  "semconv_experimental",
] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = [
  "experimental_metrics_periodicreader_with_async_runtime",
  "experimental_trace_batch_span_processor_with_async_runtime",
  "metrics",
  "rt-tokio",
  "trace",
] }
proc-macro2 = { version = "1.0.95", default-features = false }
quote = { version = "1.0.40", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_derive_internals = "0.29.1"
serde-saphyr = { version = "0.0.23", default-features = false, features = [
  "serialize",
] }
serde_tokenstream = { version = "0.2.3", default-features = false }
syn = { version = "2.0.101", default-features = false, features = [
  "clone-impls",
  "derive",
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }
tikv-jemallocator = { version = "0.6", features = [
  "profiling",
  "unprefixed_malloc_on_supported_platforms",
] }
tracing = { version = "0.1.41", default-features = false, features = [
  "attributes",
  "std",
] }
tracing-opentelemetry = { version = "0.32.0", default-features = false, features = [
  "metrics",
  "tracing-log",
] }
tracing-panic = "0.1.2"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
  "env-filter",
  "fmt",
  "parking_lot",
  "smallvec",
  "std",
] }
url = { version = "2.5.8", default-features = false, features = [
  "serde",
  "std",
] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
collapsible_match = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"                 # sometimes good to name what you are returning
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"

[profile.release]
opt-level = 3
strip = true
panic = "abort"
codegen-units = 1
lto = true

[profile.dev]
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.testing]
inherits = "dev"

[profile.testing.package."*"]
opt-level = 3
